name: Combined Pin

on:
  schedule:
    # Daily 8:00 Greek (current week, plus next on Thu/Fri)
    - cron: '0 5 * * *'   # 08:00 EEST (summer)
    - cron: '0 6 * * *'   # 08:00 EET (winter)
    # Wed 12:30 Greek (after booking, current + next week)
    - cron: '30 9 * * 3'  # 12:30 EEST
    - cron: '30 10 * * 3' # 12:30 EET
  workflow_dispatch:

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install axios

      - name: Validate Greek time
        id: timecheck
        run: |
          GREEK_HOUR=$(TZ=Europe/Athens date +%H)
          GREEK_DOW=$(TZ=Europe/Athens date +%u)  # 1=Mon..7=Sun
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=yes" >> $GITHUB_OUTPUT
          elif [ "$GREEK_HOUR" = "08" ]; then
            echo "proceed=yes" >> $GITHUB_OUTPUT
          elif [ "$GREEK_HOUR" = "12" ] && [ "$GREEK_DOW" = "3" ]; then
            echo "proceed=yes" >> $GITHUB_OUTPUT
          else
            echo "proceed=no" >> $GITHUB_OUTPUT
          fi

      - name: Write browser state
        if: steps.timecheck.outputs.proceed == 'yes'
        env:
          BROWSER_STATE_JSON: ${{ secrets.BROWSER_STATE_JSON }}
        run: echo "$BROWSER_STATE_JSON" > browser-state.json

      - name: Send combined pin
        if: steps.timecheck.outputs.proceed == 'yes'
        env:
          NTFY_TOPIC: myplanner-pkontog
        run: node cloud/combined-pin.js
