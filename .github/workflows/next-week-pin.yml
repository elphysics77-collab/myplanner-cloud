name: Next Week Pin

on:
  schedule:
    - cron: '30 9 * * 3'   # Wed 12:30 Greek (summer, EEST UTC+3)
    - cron: '30 10 * * 3'  # Wed 12:30 Greek (winter, EET UTC+2)
  workflow_dispatch:

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install axios

      - name: Validate Greek time
        id: timecheck
        run: |
          GREEK_HOUR=$(TZ=Europe/Athens date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$GREEK_HOUR" = "12" ]; then
            echo "proceed=yes" >> $GITHUB_OUTPUT
          else
            echo "proceed=no" >> $GITHUB_OUTPUT
          fi

      - name: Write browser state
        if: steps.timecheck.outputs.proceed == 'yes'
        env:
          BROWSER_STATE_JSON: ${{ secrets.BROWSER_STATE_JSON }}
        run: echo "$BROWSER_STATE_JSON" > browser-state.json

      - name: Send next-week pin
        if: steps.timecheck.outputs.proceed == 'yes'
        env:
          NTFY_TOPIC: myplanner-pkontog
        run: node cloud/next-week-pin.js
